<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <base href="$FLUTTER_BASE_HREF">

  <meta charset="UTF-8">
  <meta content="IE=Edge" http-equiv="X-UA-Compatible">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="description" content="LeuPlace - Compra, venda e encontre perto de você.">
  <meta name="theme-color" content="#FF6B00">

  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <meta name="apple-mobile-web-app-title" content="LeuPlace">
  <link rel="apple-touch-icon" href="icons/Icon-192.png">
  <link rel="icon" type="image/png" href="favicon.png"/>

  <title>LeuPlace</title>
  <link rel="manifest" href="manifest.json">

  <style>
    html, body { margin: 0; height: 100%; }
    body { background: #FFF7EE; font-family: -apple-system, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; }

    /* Tela de abertura em HTML: aparece na hora, antes do app carregar. */
    #boot-splash {
      position: fixed; inset: 0; z-index: 10;
      display: flex; flex-direction: column; align-items: center; justify-content: center;
      background: radial-gradient(circle at 50% 40%, #FFF7EE 0%, #FFD9AE 55%, #FFA95E 100%);
      transition: opacity .35s ease;
    }
    #boot-splash.hide { opacity: 0; pointer-events: none; }
    #boot-splash img { width: 150px; height: 150px; }
    #boot-splash .wordmark { margin-top: 8px; font-size: 44px; font-weight: 800; letter-spacing: -1px; line-height: 1; }
    #boot-splash .wordmark .leu { color: #6C2BD9; }
    #boot-splash .wordmark .place { color: #FF6B00; }
    #boot-splash .tagline { margin-top: 8px; color: #6C2BD9; font-size: 15px; }
    #boot-splash .bar { position: absolute; bottom: 72px; width: 180px; height: 6px; border-radius: 6px; background: rgba(255,255,255,.7); overflow: hidden; }
    #boot-splash .bar::after { content: ""; position: absolute; left: -40%; width: 40%; height: 100%; border-radius: 6px; background: #6C2BD9; animation: boot-load 1.1s ease-in-out infinite; }
    #boot-splash .label { position: absolute; bottom: 44px; color: rgba(32,33,36,.7); font-size: 13px; }
    @keyframes boot-load { to { left: 100%; } }

    /* Convite para instalar o app pelo navegador. */
    #install-banner {
      position: fixed; left: 12px; right: 12px; bottom: calc(84px + env(safe-area-inset-bottom)); z-index: 20;
      display: none; align-items: center; gap: 12px;
      padding: 12px 12px 12px 14px; border-radius: 16px;
      background: #fff; box-shadow: 0 6px 24px rgba(0,0,0,.18);
    }
    #install-banner.show { display: flex; }
    #install-banner img { width: 40px; height: 40px; border-radius: 10px; flex: none; }
    #install-banner .text { flex: 1; min-width: 0; }
    #install-banner .title { font-weight: 700; font-size: 15px; color: #202124; }
    #install-banner .sub { font-size: 12.5px; color: #5f6368; margin-top: 2px; }
    #install-banner button { border: 0; cursor: pointer; font: inherit; }
    #install-btn { padding: 10px 16px; border-radius: 22px; background: #FF6B00; color: #fff; font-weight: 700; font-size: 14px; }
    #install-close { background: none; color: #9aa0a6; font-size: 22px; line-height: 1; padding: 4px 6px; }
  </style>
</head>
<body>
  <div id="boot-splash">
    <img src="icons/leuplace_mark.png" alt="">
    <div class="wordmark"><span class="leu">Leu</span><span class="place">Place</span></div>
    <div class="tagline">Compra • Venda • Encontre</div>
    <div class="bar"></div>
    <div class="label">Carregando...</div>
  </div>

  <div id="install-banner" role="dialog" aria-label="Instalar o LeuPlace">
    <img src="icons/Icon-192.png" alt="">
    <div class="text">
      <div class="title">Instale o LeuPlace</div>
      <div class="sub" id="install-sub">Acesse direto da tela inicial, como um app.</div>
    </div>
    <button id="install-btn">Instalar</button>
    <button id="install-close" aria-label="Fechar">×</button>
  </div>

  <script>
    // Some com a tela de abertura HTML quando o app desenha a primeira tela.
    window.addEventListener('flutter-first-frame', function () {
      var s = document.getElementById('boot-splash');
      s.classList.add('hide');
      setTimeout(function () { s.remove(); }, 400);
      setTimeout(showInstallBanner, 2500);
    });

    var deferredPrompt = null;
    var DISMISS_KEY = 'leuplace_install_dismissed_at';

    function isStandalone() {
      return window.matchMedia('(display-mode: standalone)').matches || window.navigator.standalone === true;
    }
    function isIos() {
      return /iphone|ipad|ipod/i.test(navigator.userAgent);
    }
    function recentlyDismissed() {
      try {
        var at = Number(localStorage.getItem(DISMISS_KEY) || 0);
        return Date.now() - at < 3 * 24 * 60 * 60 * 1000;
      } catch (e) { return false; }
    }

    window.addEventListener('beforeinstallprompt', function (e) {
      e.preventDefault();
      deferredPrompt = e;
    });

    function showInstallBanner() {
      if (isStandalone() || recentlyDismissed()) return;
      var banner = document.getElementById('install-banner');
      var btn = document.getElementById('install-btn');
      if (deferredPrompt) {
        banner.classList.add('show');
      } else if (isIos()) {
        document.getElementById('install-sub').textContent =
          'Toque em Compartilhar e depois em "Adicionar à Tela de Início".';
        btn.style.display = 'none';
        banner.classList.add('show');
      }
    }

    document.getElementById('install-btn').addEventListener('click', async function () {
      if (!deferredPrompt) return;
      deferredPrompt.prompt();
      await deferredPrompt.userChoice;
      deferredPrompt = null;
      document.getElementById('install-banner').classList.remove('show');
    });

    document.getElementById('install-close').addEventListener('click', function () {
      try { localStorage.setItem(DISMISS_KEY, String(Date.now())); } catch (e) {}
      document.getElementById('install-banner').classList.remove('show');
    });

    window.addEventListener('appinstalled', function () {
      document.getElementById('install-banner').classList.remove('show');
    });

    // Se o navegador liberar o convite depois do app já aberto, mostra na hora.
    window.addEventListener('beforeinstallprompt', function () {
      if (!document.getElementById('boot-splash')) showInstallBanner();
    });
  </script>
  <script src="flutter_bootstrap.js" async></script>
</body>
</html>
