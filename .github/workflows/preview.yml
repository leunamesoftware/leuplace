name: Publicar app web (GitHub Pages)

# Builda o app de verdade (ligado ao backend em leuplace-api.leunamesoftware.com)
# e publica no GitHub Pages a cada push na branch principal.
# A versão de demonstração (dados fictícios) continua em lib/main_demo.dart.

on:
  push:
    branches:
      - main
      - master
      - 'claude/**'
  workflow_dispatch: {}

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  preview:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          channel: stable

      - run: flutter pub get

      - run: flutter build web -t lib/main.dart --release --base-href /leuplace/

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: build/web

      - id: deployment
        uses: actions/deploy-pages@v4
